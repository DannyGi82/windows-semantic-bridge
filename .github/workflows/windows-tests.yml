name: Windows tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python compilation
        run: python -m compileall -q .
      - name: Automated tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests browser_lane/tests --ignore=browser_lane/tests/test_cdp_integration.py
